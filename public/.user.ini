; PHP limits for this storefront, read by php-fpm and other CGI/FastCGI
; setups (mod_php ignores this file; see deploy/apache-vhost.conf).
;
; Intake file uploads are relayed to the EMR one request at a time, and one
; request carries up to 10 MB: a whole document, or one part of a video. Lower
; limits still work -- the page sends what this server can take -- but a file
; between the limit and 10 MB then has to go up in parts, and below 5 MB a
; large file cannot go up at all.
upload_max_filesize = 11M
post_max_size = 12M
