# AsterMD storefront — Apache sample vhost. Requires mod_rewrite and
# mod_proxy_fcgi (or mod_php). See deploy/README.md for the how-to.
<VirtualHost *:80>
    ServerName example.com
    DocumentRoot /var/www/storefront/public

    <Directory /var/www/storefront/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Forwarding headers are a proxy's to set, never the client's. The app
    # trusts X-Forwarded-Proto to decide whether the session cookie gets the
    # Secure flag, and the real-client IP headers to tell the EMR where a
    # visitor came from, so a client-sent value would suppress Secure on a TLS
    # site and poison session attribution. Requires mod_headers.
    #
    # Behind a CDN or load balancer that legitimately sets one of these
    # (Cloudflare sets CF-Connecting-IP; an ALB sets X-Forwarded-*), delete
    # only that line — and make sure nothing can reach this server except
    # through that hop, or you have re-opened the spoof you just closed.
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Forwarded-For
    RequestHeader unset CF-Connecting-IP
    RequestHeader unset True-Client-IP

    # Belt-and-braces deny (paths live outside the docroot already).
    <DirectoryMatch "/(config|storage|core|vendor|bin|database)/">
        Require all denied
    </DirectoryMatch>

    # Deny any path containing a dot-prefixed segment anywhere (/.git/config etc.)
    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>

    # Only the front controller executes PHP; all other .php files are denied
    # (mirrors nginx's `location ~ \.php$ { return 404; }`).
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
        SetHandler "proxy:unix:/var/run/php/php-fpm.sock|fcgi://localhost"
    </Files>

    <LocationMatch "^/assets/build/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>
