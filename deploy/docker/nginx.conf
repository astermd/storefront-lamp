# AsterMD storefront — nginx for the Docker image. The server block follows
# deploy/nginx.conf; the differences are only what a container needs: nginx
# runs unprivileged on port 8080, writes its pid and temp files under /tmp,
# logs to the container's stdout/stderr, and reaches php-fpm over loopback.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Intake file uploads are relayed to the EMR one request at a time,
        # and one request carries up to 10 MB. PHP's own pair of limits is in
        # public/.user.ini.
        client_max_body_size 12m;

        # Belt-and-braces: these live outside the docroot already; deny anyway.
        location ~ ^/(config|storage|core|vendor|bin|database)/ { deny all; }
        location ~ /\. { deny all; }

        # Hashed build assets are immutable.
        location /assets/build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /assets/ { try_files $uri =404; }

        location / { try_files $uri /index.php$is_args$args; }

        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Forwarding headers are a proxy's to set, never the client's —
            # see the same block in deploy/nginx.conf. If this container sits
            # behind a load balancer or CDN that sets one of these, delete only
            # that line, and only if nothing can reach the container except
            # through that hop.
            fastcgi_param HTTP_X_FORWARDED_PROTO "";
            fastcgi_param HTTP_X_FORWARDED_FOR "";
            fastcgi_param HTTP_CF_CONNECTING_IP "";
            fastcgi_param HTTP_TRUE_CLIENT_IP "";

            fastcgi_pass 127.0.0.1:9000;
        }

        # Only the front controller executes PHP.
        location ~ \.php$ { return 404; }
    }
}
