; PHP settings for the Docker image, layered over php.ini-production.
;
; The upload limits are not set here: public/.user.ini already carries them and
; php-fpm reads it, so a second copy would only be a second thing to keep in step.

expose_php = Off

; In a container the environment is the configuration channel, so it has to be
; visible in $_ENV. php.ini-production says GPCS, which leaves $_ENV holding
; only what .env supplied — and core/Emr/ClientFactory.php reads the EMR
; credentials from $_ENV alone, so credentials given with `-e` or `--env-file`
; would never reach it. A real environment variable still beats .env: Dotenv
; loads immutably and skips any name the environment already defines.
variables_order = "EGPCS"

; The image ships one application, so OPcache can hold all of it. Timestamp
; validation is driven by the environment: off in the production image, where
; code only changes with a new image, and on in the dev target, where the
; source is bind-mounted and edited live.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
