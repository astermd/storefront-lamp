; php-fpm pool overrides for the Docker image. Named zzz- so it loads after the
; image's own www.conf and zz-docker.conf and wins over both.

[www]
; nginx runs in the same container and is the only client.
listen = 127.0.0.1:9000

; php-fpm's default is to start workers with an empty environment, which would
; drop every variable given to the container with `-e` or `--env-file`. The
; application reads its settings from the process environment first and from
; .env second (core/Support/Config.php), so the environment has to reach it.
clear_env = no

; nginx already writes one access line per request; a second from php-fpm
; would only double the container log.
access.log = /dev/null

; Workers send stdout/stderr to the container log instead of discarding them.
catch_workers_output = yes
decorate_workers_output = no
