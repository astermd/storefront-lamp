# AsterMD storefront — nginx sample. Set server_name, root path and the
# php-fpm socket, add TLS, and this file is complete (stack [10.12]).
server {
    listen 80;
    server_name example.com;
    root /var/www/storefront/public;
    index index.php;

    # Belt-and-braces: these live outside the docroot already; deny anyway.
    location ~ ^/(config|storage|core|vendor|bin|database)/ { deny all; }
    location ~ /\. { deny all; }

    # Hashed build assets are immutable.
    location /assets/build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ { try_files $uri =404; }

    location / { try_files $uri /index.php$is_args$args; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Forwarding headers are a proxy's to set, never the client's. The app
        # trusts X-Forwarded-Proto to decide whether the session cookie gets
        # the Secure flag, and the real-client IP headers to tell the EMR where
        # a visitor came from, so a client-sent value would suppress Secure on
        # a TLS site and poison session attribution. Blanked here, the same way
        # HTTP_PROXY is blanked against httpoxy.
        #
        # Behind a CDN or load balancer that legitimately sets one of these
        # (Cloudflare sets CF-Connecting-IP; an ALB sets X-Forwarded-*), delete
        # only that line — and make sure nothing can reach this server except
        # through that hop, or you have re-opened the spoof you just closed.
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_CF_CONNECTING_IP "";
        fastcgi_param HTTP_TRUE_CLIENT_IP "";

        fastcgi_pass unix:/var/run/php/php-fpm.sock;
    }

    # Only the front controller executes PHP.
    location ~ \.php$ { return 404; }
}
